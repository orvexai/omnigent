# Build standalone `omnigent` executables for Linux, Windows and macOS and
# attach them to a GitHub Release.
#
# Why this exists alongside release-omnigent.yml: upstream ships omnigent as
# pure-Python wheels, so a single artifact already covers every OS *for users
# who have Python and uv*. This workflow targets the other case — dropping one
# self-contained file on a machine (a host/runner box, a locked-down laptop)
# with no Python toolchain at all.
#
# Release flow:
#   1. Push an `orvex-vN` tag -> build and smoke the Linux binary, then publish
#      a draft GitHub Release with its archives, wheels + SHA256SUMS attached.
#   2. Review the draft, then publish it by hand.
#   Manual `workflow_dispatch` builds and uploads the Linux artifact WITHOUT
#   touching Releases. Set `build_other_platforms` to also exercise the
#   Windows and macOS packaging legs on their platform runners.
#
# Versioning: this fork does not own the version in `pyproject.toml` — that is
# upstream's, and it moves under us on every rebase. Releases are numbered by
# an orvex serial N carried in the tag, and stamped at BUILD TIME as
# `<upstream base>+orvex.N` (a PEP 440 local segment). Nothing is committed, so
# the stamp can never conflict with an upstream merge, and the version still
# records which upstream line it was cut from. Serials sort ahead of a bare
# upstream version and ahead of each other, so upgrades resolve correctly.
#
# The tag namespace is ours on purpose. Upstream owns 40-odd `v*` tags; a
# single `git push origin --tags` after a sync would otherwise fire this
# workflow once per upstream tag, and any tag reachable from mcp would pass
# the ref guard and publish a bogus release.
#
# The SPA is built by setup.py during `pip install .` (it is skipped only when
# OMNIGENT_SKIP_WEB_UI=true), so every platform sets up Node + pnpm and the
# bundle lands in site-packages where --collect-all picks it up.
name: Release binaries (Linux/Windows/macOS)

on:
  push:
    tags:
      - "orvex-v*"
  workflow_dispatch:
    inputs:
      skip_web_ui:
        description: "Build without the bundled web UI (faster; CLI/host only)."
        type: boolean
        default: false
      build_other_platforms:
        description: "Also build the Windows and macOS binaries on platform runners."
        type: boolean
        default: false
  # CI-test the workflow on change; the publish job is gated off PR events.
  pull_request:
    paths:
      - ".github/workflows/release-binaries.yml"

permissions:
  contents: read

# Serialize on the ref so a re-tag can't race itself.
concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Binaries ship from `mcp` only. Without this, the rule would rest on the
  # workflow file happening to live on one branch — merge it elsewhere and that
  # branch silently gains the ability to cut a release.
  guard:
    if: github.repository == 'orvexai/omnigent'
    name: release-ref
    runs-on: public-runners
    timeout-minutes: 5

    steps:
      # A pull_request run is the workflow's own CI test (paths-filtered to
      # this file) and its publish job is gated off PR events, so it builds
      # without ever releasing. Everything else must come from mcp.
      - if: github.event_name != 'pull_request'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - if: github.event_name != 'pull_request'
        name: Require the ref to be mcp
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$REF" = "refs/heads/mcp" ]; then
            echo "ref is mcp"
            exit 0
          fi
          # A tag is allowed only when the commit it names is on mcp, so a tag
          # cut from another branch cannot smuggle a build through.
          serial="${REF#refs/tags/orvex-v}"
          if [ "$serial" != "$REF" ]; then
            if ! [[ "$serial" =~ ^[0-9]+$ ]]; then
              echo "::error::Tag $REF is malformed. Release tags are orvex-vN, e.g. orvex-v3."
              exit 1
            fi
            git fetch --quiet origin mcp
            if ! git merge-base --is-ancestor "$SHA" origin/mcp; then
              echo "::error::Tag $REF names $SHA, which is not on mcp. Binaries ship from mcp only."
              exit 1
            fi
            # Serials must only ever climb: a reused or lowered one would
            # publish a release that resolves as older than what is installed,
            # so an upgrade would silently decline to move.
            highest=0
            for existing in $(git tag --list 'orvex-v[0-9]*'); do
              n="${existing#orvex-v}"
              [[ "$n" =~ ^[0-9]+$ ]] || continue
              [ "$n" = "$serial" ] && continue
              [ "$n" -gt "$highest" ] && highest="$n"
            done
            if [ "$serial" -le "$highest" ]; then
              echo "::error::orvex-v$serial does not exceed the highest existing serial (orvex-v$highest). Tag orvex-v$((highest + 1))."
              exit 1
            fi
            echo "tag $REF is reachable from mcp; serial $serial > $highest"
            exit 0
          fi
          echo "::error::$REF is not mcp. Binaries ship from mcp only; re-run this workflow on mcp."
          exit 1

  build-linux:
    # Gated to this fork; inert upstream and in other mirrors.
    if: github.repository == 'orvexai/omnigent'
    needs: guard
    name: linux-x86_64
    # This is the org's own self-hosted Linux pool; the repo's CI proves
    # that the public-runners label resolves to an online runner.
    runs-on: public-runners
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version-file: .python-version

      # setup.py shells out to pnpm to build the SPA into
      # omnigent/server/static/web-ui unless OMNIGENT_SKIP_WEB_UI=true.
      # setup-node BEFORE pnpm/action-setup: its self-installer needs a Node
      # binary. Same order the repo's other pnpm workflows use.
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        if: ${{ !inputs.skip_web_ui }}
        with:
          node-version: 22
      # Must equal package.json's "packageManager" pin — action-setup v4 hard
      # errors when a `version:` here disagrees with it.
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        if: ${{ !inputs.skip_web_ui }}
        with:
          version: 11.15.1
          standalone: true

      # Stamp the orvex release serial into the lockstep version before the
      # build reads it. Deliberately not committed: pyproject's version is
      # upstream's, so an in-tree edit would conflict on every rebase.
      - name: Stamp the orvex release version
        if: startsWith(github.ref, 'refs/tags/orvex-v')
        shell: bash
        run: |
          set -euo pipefail
          serial="${GITHUB_REF#refs/tags/orvex-v}"
          base="$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          python -m pip install --quiet packaging
          python scripts/update_versions.py pre-release --new-version "${base}+orvex.${serial}"
          echo "stamped ${base}+orvex.${serial}"

      - name: Install omnigent + PyInstaller
        shell: bash
        env:
          OMNIGENT_SKIP_WEB_UI: ${{ inputs.skip_web_ui && 'true' || 'false' }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # Install local SDK siblings explicitly because pip ignores [tool.uv.sources]. Keep installs
          # non-editable: PyInstaller collects from site-packages, not path hooks --collect-all cannot walk.
          python -m pip install ./sdks/python-client ./sdks/ui .
          python -m pip install pyinstaller==6.11.1

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c "import omnigent.version as v; print(v.VERSION)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building omnigent $version for linux-x86_64"

      - name: Build executable
        shell: bash
        run: |
          set -euo pipefail
          # --collect-all pulls omnigent's package data (alembic migrations,
          #   the SPA bundle, bundled agent configs) plus every submodule the
          #   CLI imports lazily.
          # --copy-metadata is REQUIRED, not cosmetic: harness_plugins.py
          #   discovers community harnesses through
          #   importlib.metadata.entry_points(), which reads dist metadata that
          #   PyInstaller otherwise drops — without it the harness registry
          #   silently loses every plugin.
          pyinstaller \
            --name omnigent \
            --onefile \
            --console \
            --noconfirm \
            --clean \
            --collect-all omnigent \
            --copy-metadata omnigent \
            --hidden-import omnigent.cli \
            --collect-all alembic \
            --collect-submodules uvicorn \
            --collect-submodules passlib \
            scripts/pyinstaller_entry.py

      # A binary that imports but cannot run its own CLI is worse than a build
      # failure, because it ships. Exercise the real entry point.
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          bin=dist/omnigent
          # Not `[ ... ] && bin=...`: under `set -e` the false branch returns
          # non-zero and would abort the step on every non-Windows runner.
          if [ "${{ runner.os }}" = "Windows" ]; then
            bin=dist/omnigent.exe
          fi
          "$bin" --version
          "$bin" --help > /dev/null
          # --version/--help short-circuit before the app is constructed, so
          # they prove only that argparse works. A binary missing the SPA
          # bundle, alembic's migration scripts, or a uvicorn/passlib
          # submodule passes both and ships, then dies on the user's first
          # `omnigent server`. Boot the real server and require a healthy
          # response.
          export OMNIGENT_DATA_DIR="$(python -c 'import tempfile; print(tempfile.mkdtemp())')"
          export OMNIGENT_CONFIG_HOME="$(python -c 'import tempfile; print(tempfile.mkdtemp())')"
          "$bin" server --port 8765 > serve.log 2>&1 &
          serve_pid=$!
          set +e
          python - "$serve_pid" <<'PY'
          import os
          import sys
          import time
          import urllib.request

          pid = int(sys.argv[1])
          healthy = False
          for _ in range(60):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8765/health", timeout=1) as response:
                      healthy = 200 <= response.status < 300
                      if healthy:
                          break
              except Exception:
                  pass
              try:
                  os.kill(pid, 0)
              except OSError:
                  break
              time.sleep(1)
          raise SystemExit(0 if healthy else 1)
          PY
          health_status=$?
          set -e
          kill "$serve_pid" 2>/dev/null || true
          if [ "$health_status" -ne 0 ]; then
            echo "server failed to become healthy; log follows:" >&2
            cat serve.log >&2
            exit 1
          fi
          echo "smoke OK (CLI + server boot)"

      - name: Package
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          name="omnigent-${{ steps.ver.outputs.version }}-linux-x86_64"
          mkdir -p out
          python - "$name" <<'PY'
          import sys
          import tarfile
          from pathlib import Path

          name = sys.argv[1]
          with tarfile.open(Path("out") / f"{name}.tar.gz", "w:gz") as archive:
              archive.add("dist/omnigent", arcname="omnigent")
          PY
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: out/*
          if-no-files-found: error

      # Wheels ride along with the binary so the installer can pin a released
      # version instead of building from a moving branch. Built here rather
      # than in their own job because this one already has Node + pnpm and has
      # just built the SPA into the tree, so packaging is nearly free.
      - name: Build wheels
        shell: bash
        run: |
          set -euo pipefail
          # The two SDK siblings are pinned `==` as path deps, so they must be
          # built alongside or the app wheel cannot resolve them at install.
          python -m pip wheel --no-deps --wheel-dir wheels \
            ./sdks/python-client ./sdks/ui .
          ls -la wheels

      # A wheel missing the SPA still installs and still exits 0, and the loss
      # only shows as an API-only page on the user's first `omnigent server`.
      - name: Assert the web UI shipped in the wheel
        if: ${{ !(inputs.skip_web_ui) }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob
          import sys
          import zipfile

          matches = glob.glob("wheels/omnigent-*.whl")
          if not matches:
              sys.exit("no omnigent wheel was produced")
          with zipfile.ZipFile(matches[0]) as wheel:
              bundled = [n for n in wheel.namelist() if "server/static/web-ui/" in n]
          if not bundled:
              sys.exit(f"{matches[0]} contains no web-ui bundle")
          print(f"{matches[0]}: {len(bundled)} web-ui entries")
          PY

      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: omnigent-wheels
          path: wheels/*.whl
          if-no-files-found: error

  build-other-platforms:
    # Platform-specific runners are intentionally opt-in because the default
    # org runner is Linux. These legs are independent from the Linux build.
    if: github.repository == 'orvexai/omnigent' && inputs.build_other_platforms
    needs: guard
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # One platform failing must not hide the others' results.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x86_64
            archive: zip
          - os: macos-14 # Apple silicon
            target: macos-arm64
            archive: tar.gz
          - os: macos-15-intel # Intel; macos-13 was retired Dec 2025
            target: macos-x86_64
            archive: tar.gz

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version-file: .python-version

      # setup.py shells out to pnpm to build the SPA into
      # omnigent/server/static/web-ui unless OMNIGENT_SKIP_WEB_UI=true.
      # setup-node BEFORE pnpm/action-setup: its self-installer needs a Node
      # binary. Same order the repo's other pnpm workflows use.
      - uses: actions/setup-node@39370e3970a6d050c480ff0ed4d3fdee5af # v4.1.0
        if: ${{ !inputs.skip_web_ui }}
        with:
          node-version: 22
      # Must equal package.json's "packageManager" pin — action-setup v4 hard
      # errors when a `version:` here disagrees with it.
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        if: ${{ !inputs.skip_web_ui }}
        with:
          version: 11.15.1
          standalone: true

      # Stamp the orvex release serial into the lockstep version before the
      # build reads it. Deliberately not committed: pyproject's version is
      # upstream's, so an in-tree edit would conflict on every rebase.
      - name: Stamp the orvex release version
        if: startsWith(github.ref, 'refs/tags/orvex-v')
        shell: bash
        run: |
          set -euo pipefail
          serial="${GITHUB_REF#refs/tags/orvex-v}"
          base="$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          python -m pip install --quiet packaging
          python scripts/update_versions.py pre-release --new-version "${base}+orvex.${serial}"
          echo "stamped ${base}+orvex.${serial}"

      - name: Install omnigent + PyInstaller
        shell: bash
        env:
          OMNIGENT_SKIP_WEB_UI: ${{ inputs.skip_web_ui && 'true' || 'false' }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # Install local SDK siblings explicitly because pip ignores [tool.uv.sources]. Keep installs
          # non-editable: PyInstaller collects from site-packages, not path hooks --collect-all cannot walk.
          python -m pip install ./sdks/python-client ./sdks/ui .
          python -m pip install pyinstaller==6.11.1

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c "import omnigent.version as v; print(v.VERSION)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building omnigent $version for ${{ matrix.target }}"

      - name: Build executable
        shell: bash
        run: |
          set -euo pipefail
          # --collect-all pulls omnigent's package data (alembic migrations,
          #   the SPA bundle, bundled agent configs) plus every submodule the
          #   CLI imports lazily.
          # --copy-metadata is REQUIRED, not cosmetic: harness_plugins.py
          #   discovers community harnesses through
          #   importlib.metadata.entry_points(), which reads dist metadata that
          #   PyInstaller otherwise drops — without it the harness registry
          #   silently loses every plugin.
          pyinstaller \
            --name omnigent \
            --onefile \
            --console \
            --noconfirm \
            --clean \
            --collect-all omnigent \
            --copy-metadata omnigent \
            --hidden-import omnigent.cli \
            --collect-all alembic \
            --collect-submodules uvicorn \
            --collect-submodules passlib \
            scripts/pyinstaller_entry.py

      # A binary that imports but cannot run its own CLI is worse than a build
      # failure, because it ships. Exercise the real entry point.
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          bin=dist/omnigent
          # Not `[ ... ] && bin=...`: under `set -e` the false branch returns
          # non-zero and would abort the step on every non-Windows runner.
          if [ "${{ runner.os }}" = "Windows" ]; then
            bin=dist/omnigent.exe
          fi
          "$bin" --version
          "$bin" --help > /dev/null
          # --version/--help short-circuit before the app is constructed, so
          # they prove only that argparse works. A binary missing the SPA
          # bundle, alembic's migration scripts, or a uvicorn/passlib
          # submodule passes both and ships, then dies on the user's first
          # `omnigent server`. Boot the real server and require a healthy
          # response.
          export OMNIGENT_DATA_DIR="$(python -c 'import tempfile; print(tempfile.mkdtemp())')"
          export OMNIGENT_CONFIG_HOME="$(python -c 'import tempfile; print(tempfile.mkdtemp())')"
          "$bin" server --port 8765 > serve.log 2>&1 &
          serve_pid=$!
          set +e
          python - "$serve_pid" <<'PY'
          import os
          import sys
          import time
          import urllib.request

          pid = int(sys.argv[1])
          healthy = False
          for _ in range(60):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8765/health", timeout=1) as response:
                      healthy = 200 <= response.status < 300
                      if healthy:
                          break
              except Exception:
                  pass
              try:
                  os.kill(pid, 0)
              except OSError:
                  break
              time.sleep(1)
          raise SystemExit(0 if healthy else 1)
          PY
          health_status=$?
          set -e
          kill "$serve_pid" 2>/dev/null || true
          if [ "$health_status" -ne 0 ]; then
            echo "server failed to become healthy; log follows:" >&2
            cat serve.log >&2
            exit 1
          fi
          echo "smoke OK (CLI + server boot)"

      - name: Package
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          name="omnigent-${{ steps.ver.outputs.version }}-${{ matrix.target }}"
          mkdir -p out
          python - "${{ matrix.archive }}" "$name" <<'PY'
          import sys
          import tarfile
          import zipfile
          from pathlib import Path

          archive_type, name = sys.argv[1:]
          if archive_type == "zip":
              with zipfile.ZipFile(Path("out") / f"{name}.zip", "w", zipfile.ZIP_DEFLATED) as archive:
                  archive.write("dist/omnigent.exe", arcname="omnigent.exe")
          else:
              with tarfile.open(Path("out") / f"{name}.tar.gz", "w:gz") as archive:
                  archive.add("dist/omnigent", arcname="omnigent")
          PY
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: out/*
          if-no-files-found: error

  publish:
    # Tag pushes only: a manual run leaves the artifacts on the run and never
    # creates or mutates a Release.
    if: startsWith(github.ref, 'refs/tags/orvex-v') && github.repository == 'orvexai/omnigent'
    needs: build-linux
    runs-on: public-runners
    timeout-minutes: 15
    permissions:
      contents: write # create the release + upload assets
    steps:
      # setup-python reads .python-version from the workspace, so the checkout
      # is load-bearing here, not incidental — without it this job fails before
      # it can assemble anything.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version-file: .python-version

      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: dl

      - name: Collect + checksum
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import shutil
          from pathlib import Path

          out = Path("out")
          out.mkdir()
          # Wheels ship beside the platform archives: the installer resolves a
          # pinned release from them rather than building from a branch.
          artifacts = sorted(
              path for path in Path("dl").rglob("*")
              if path.is_file()
              and (path.name.endswith(".tar.gz") or path.suffix in {".zip", ".whl"})
          )
          for artifact in artifacts:
              shutil.move(str(artifact), out / artifact.name)
          checksums = []
          for artifact in sorted(out.iterdir()):
              if artifact.name == "SHA256SUMS":
                  continue
              digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
              checksums.append(f"{digest}  {artifact.name}")
          (out / "SHA256SUMS").write_text("\n".join(checksums) + "\n")
          PY
          ls -la out

      # Draft, not published: a human eyeballs the Linux archive before this
      # becomes the thing users download.
      - uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          draft: true
          generate_release_notes: true
          files: out/*
