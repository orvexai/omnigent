apiVersion: v1
kind: ConfigMap
metadata:
  name: omnigent-config
  labels:
    app: omnigent
data:
  HOST: "0.0.0.0"
  PORT: "8000"
  ARTIFACT_DIR: "/data/artifacts"
  # Comma-separated release features; empty keeps every feature off.
  OMNIGENT_FEATURES: ""
  OMNIGENT_ADMIN_CREDENTIALS_PATH: "/data/admin-credentials"
  OMNIGENT_AUTH_ENABLED: "1"
  OMNIGENT_AUTH_PROVIDER: "accounts"
  OMNIGENT_ACCOUNTS_AUTO_OPEN: "0"
  # Non-SQLite connection pool: retain the thread ceiling and borrow for bursts.
  OMNIGENT_DB_POOL_SIZE: "32"
  OMNIGENT_DB_MAX_OVERFLOW: "32"
  OMNIGENT_DB_POOL_TIMEOUT_SECONDS: "10"
