---
# Dedicated rollout identity for the omnigent-app-build pipeline.
#
# The build runs as the shared tekton-smoke-test-builder SA, which has no
# cross-namespace write rights. The finally rollout-restart task needs to
# patch the `omnigent` Deployment in the `omnigent` namespace, so it runs as
# this purpose-built SA instead — keeping the build SA's blast radius
# unchanged and this app's CI self-contained.
#
# `rollout restart` is implemented as a strategic-merge PATCH of the pod
# template, so get + patch on apps/deployments is sufficient (no create/delete).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-omnigent-rollout
  namespace: tekton-pipelines
  labels:
    app.kubernetes.io/part-of: omnigent
    app.kubernetes.io/component: ci-cd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tekton-omnigent-rollout
  labels:
    app.kubernetes.io/part-of: omnigent
    app.kubernetes.io/component: ci-cd
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-omnigent-rollout
  labels:
    app.kubernetes.io/part-of: omnigent
    app.kubernetes.io/component: ci-cd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-omnigent-rollout
subjects:
  - kind: ServiceAccount
    name: tekton-omnigent-rollout
    namespace: tekton-pipelines
