---
# Auto-build the Omnigent server image on push to the "web" branch —
# discovered by the platform's org-wide github-webhook-listener (no per-repo
# webhook plumbing here).
#
# Flow: push to orvexai/omnigent (web branch) -> GitHub webhook -> platform
#       listener -> this Trigger (filters repo + branch) -> PipelineRun
#       -> build omnigent/omnigent:web -> rollout-restart consumers.
#
# No changed-path filter: the daily upstream-sync workflow pushes merge
# commits whose file list can be large/truncated in the webhook payload, so
# every push to web triggers a rebuild rather than risking a silent skip.
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: omnigent-app-build-template
  namespace: tekton-pipelines
  labels:
    app.kubernetes.io/part-of: omnigent
spec:
  params:
    - name: git-url
      description: Clone URL (from the push payload)
      default: https://github.com/orvexai/omnigent.git
    - name: git-revision
      description: Commit SHA to build (from the push payload)
    - name: image-tag
      description: |
        Image tag derived from the git ref:
          refs/heads/web → web
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: omnigent-app-build-$(tt.params.image-tag)-
        namespace: tekton-pipelines
        labels:
          app.kubernetes.io/name: omnigent-app-build
          tekton.dev/pipeline: omnigent-app-build
          orvex.ai/branch: $(tt.params.image-tag)
      spec:
        pipelineRef:
          name: omnigent-app-build
        params:
          - name: repo-url
            value: $(tt.params.git-url)
          - name: revision
            value: $(tt.params.git-revision)
          - name: image-tag
            value: $(tt.params.image-tag)
        taskRunTemplate:
          serviceAccountName: tekton-smoke-test-builder
        taskRunSpecs:
          # The rollout task needs cross-namespace deployment patch rights;
          # the build SA does not. Use the dedicated omnigent rollout SA
          # (rollout-rbac.yaml).
          - pipelineTaskName: rollout-restart
            serviceAccountName: tekton-omnigent-rollout
          - pipelineTaskName: run-migrations
            serviceAccountName: tekton-omnigent-migrate
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    # Node web build + Python/uv build — comparable weight to
                    # docmost's pnpm monorepo build.
                    storage: 10Gi
                storageClassName: rook-cephfs
          - name: dockerconfig
            secret:
              secretName: tekton-harbor-credentials
---
apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: omnigent-app-build-push
  namespace: tekton-pipelines
  labels:
    app.kubernetes.io/part-of: omnigent
    # Opt in to discovery by the platform github-webhook-listener.
    ci.my-idp/discover: "true"
spec:
  interceptors:
    # Validate the shared webhook HMAC and only accept push events.
    - ref:
        name: github
        kind: ClusterInterceptor
      params:
        - name: secretRef
          value:
            secretName: github-webhook-secret
            secretKey: secret
        - name: eventTypes
          value: ["push"]
    - ref:
        name: cel
        kind: ClusterInterceptor
      params:
        # Build only on pushes to the web branch of this repo.
        - name: filter
          value: >-
            body.repository.name == 'omnigent' &&
            body.ref == 'refs/heads/web'
        - name: overlays
          value:
            - key: image-tag
              expression: "body.ref.replace('refs/heads/', '').replace('/', '-')"
            # github-push-defaults also binds git-branch from
            # extensions.git-branch; publish it or the binding fails
            # ApplyEventValuesToParams (no PipelineRun).
            - key: git-branch
              expression: "body.ref.replace('refs/heads/', '')"
  bindings:
    # Platform-wide binding: extracts git-url and git-revision from the payload.
    - ref: github-push-defaults
      kind: ClusterTriggerBinding
    # Map the CEL overlay into the TriggerTemplate param.
    - kind: TriggerBinding
      name: image-tag
      value: $(extensions.image-tag)
  template:
    ref: omnigent-app-build-template
