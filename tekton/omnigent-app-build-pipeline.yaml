---
# Tekton Pipeline: build the Omnigent server image and roll it out.
#
# Dockerfile-based build (deploy/docker/Dockerfile, context = repo root) via
# the shared buildah-with-args Task. Pushes to the in-cluster Harbor bypass
# endpoint (repos-direct.*) — the Deployment still pulls through the
# Cloudflare proxy (repos.eu-central-1.myidp.cloud), same split docmost uses.
#
# Built from the "orvex" branch only — that branch carries our own patches on
# top of upstream and is kept current by a daily merge-from-upstream workflow
# (see .github/workflows/sync-upstream.yml). main tracks upstream unmodified.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: omnigent-app-build
  namespace: tekton-pipelines
  labels:
    app.kubernetes.io/name: omnigent-app-build-pipeline
    app.kubernetes.io/component: ci-cd
    app.kubernetes.io/part-of: omnigent
spec:
  description: Build and push the Omnigent server image, then restart its consumers.
  params:
    - name: repo-url
      type: string
      default: https://github.com/orvexai/omnigent.git
    - name: revision
      type: string
      default: orvex
    - name: image-registry
      type: string
      default: repos-direct.eu-central-1.myidp.cloud
    - name: image-namespace
      type: string
      default: omnigent
    - name: image-name
      type: string
      default: omnigent
    - name: image-tag
      type: string
      default: orvex
  workspaces:
    - name: source
      description: Workspace for the cloned source tree
    - name: dockerconfig
      description: Harbor registry credentials (.dockerconfigjson)
  tasks:
    - name: clone-repo
      taskRef:
        kind: Task
        name: git-clone
      workspaces:
        - name: output
          workspace: source
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
        - name: deleteExisting
          value: "true"
    - name: build-and-push
      runAfter:
        - clone-repo
      taskRef:
        kind: Task
        name: buildah-with-args
      workspaces:
        - name: source
          workspace: source
        - name: dockerconfig
          workspace: dockerconfig
      params:
        - name: IMAGE
          value: "$(params.image-registry)/$(params.image-namespace)/$(params.image-name):$(params.image-tag)"
        - name: DOCKERFILE
          value: "deploy/docker/Dockerfile"
        - name: CONTEXT
          value: "."
        - name: TLS_VERIFY
          value: "false"
    - name: run-migrations
      runAfter:
        - build-and-push
      params:
        - name: image-digest
          value: $(tasks.build-and-push.results.IMAGE_DIGEST)
      taskSpec:
        params:
          - name: image-digest
            type: string
        steps:
          - name: submit-job
            image: alpine/k8s:1.31.4
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            script: |
              #!/bin/bash
              set -eu
              JOB="$(kubectl create -f - -o name <<EOF
              apiVersion: batch/v1
              kind: Job
              metadata:
                generateName: omnigent-migrate-
                namespace: omnigent
                labels:
                  app.kubernetes.io/name: omnigent-migrate
                  app.kubernetes.io/part-of: omnigent
              spec:
                backoffLimit: 1
                ttlSecondsAfterFinished: 3600
                activeDeadlineSeconds: 900
                template:
                  spec:
                    restartPolicy: Never
                    automountServiceAccountToken: false
                    imagePullSecrets:
                      - name: harbor-registry-credentials
                    containers:
                      - name: migrate
                        image: repos.eu-central-1.myidp.cloud/$(params.image-namespace)/$(params.image-name)@$(params.image-digest)
                        imagePullPolicy: Always
                        command: ["python", "/app/entrypoint.py", "--migrate-only"]
                        envFrom:
                          - configMapRef:
                              name: omnigent-config
                        env:
                          - name: DB_USER
                            valueFrom:
                              secretKeyRef:
                                name: omnigent-db-app
                                key: username
                          - name: DB_PASSWORD
                            valueFrom:
                              secretKeyRef:
                                name: omnigent-db-app
                                key: password
                          - name: DATABASE_URL
                            value: "postgresql+psycopg://\$(DB_USER):\$(DB_PASSWORD)@omnigent-db-rw.omnigent.svc:5432/omnigent"
              EOF
              )"
              JOB_NAME="${JOB##*/}"
              status=0
              remaining=930
              while [ "$remaining" -gt 0 ]; do
                complete="$(kubectl get --namespace omnigent "${JOB}" -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}')"
                failed="$(kubectl get --namespace omnigent "${JOB}" -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}')"
                if [ "$complete" = "True" ]; then
                  break
                fi
                if [ "$failed" = "True" ]; then
                  status=1
                  break
                fi
                waiting_reason="$(kubectl get pods -n omnigent -l job-name="$JOB_NAME" -o jsonpath='{.items[*].status.containerStatuses[*].state.waiting.reason}')"
                case "$waiting_reason" in
                  *ImagePullBackOff*|*ErrImagePull*|*InvalidImageName*|*CreateContainerConfigError*)
                    echo "Migration Job pod failed to start: $waiting_reason"
                    status=1
                    break
                    ;;
                esac
                sleep 5
                remaining=$((remaining - 5))
              done
              if [ "$remaining" -le 0 ]; then
                status=1
              fi
              kubectl logs --namespace omnigent "${JOB}" || true
              kubectl delete --namespace omnigent "${JOB}" --ignore-not-found || true
              exit "$status"
  finally:
    # The image is a MOVING tag (:orvex) pulled with imagePullPolicy: Always,
    # so a rollout restart (patches the pod-template restartedAt annotation)
    # is sufficient to pick up the freshly-pushed image — no manifest change
    # required. ArgoCD selfHeal does not revert this because it does not own
    # the restartedAt annotation.
    - name: rollout-restart
      when:
        - input: $(tasks.build-and-push.status)
          operator: in
          values: ["Succeeded"]
        - input: $(tasks.run-migrations.status)
          operator: in
          values: ["Succeeded"]
      params:
        - name: image-tag
          value: $(params.image-tag)
      taskSpec:
        params:
          - name: image-tag
            type: string
        steps:
          - name: restart
            image: alpine/k8s:1.31.4
            # alpine/k8s runs as root by default (unlike bitnami/kubectl,
            # which docmost's copy of this pattern used and is banned by
            # this platform's image policy) — no runAsNonRoot here.
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            script: |
              #!/bin/bash
              set -eu
              TAG="$(params.image-tag)"
              case "$TAG" in
                orvex) TARGETS="omnigent" ;;
                *)     echo "No rollout targets for tag '$TAG' — skipping"; exit 0 ;;
              esac
              rc=0
              for NS in $TARGETS; do
                echo "Restarting deployment/omnigent in $NS"
                kubectl rollout restart deployment/omnigent -n "$NS" || rc=1
                kubectl rollout status deployment/omnigent -n "$NS" --timeout=630s || rc=1
              done
              exit $rc
